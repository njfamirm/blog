<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KINETIC ASCII BIO-TRACKER</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%; height: 100%;
            background-color: #050505; color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        /* Scanline Overlay */
        .crt-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 50;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
        }

        /* HUD UI */
        #hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 40; display: none;
            padding: 20px; flex-direction: column; justify-content: space-between;
        }
        
        .hud-panel {
            background: rgba(0, 20, 0, 0.6);
            border: 1px solid #0f0;
            padding: 15px; width: 300px;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
            backdrop-filter: blur(4px);
        }

        .hud-title { font-weight: bold; font-size: 1.2rem; margin-bottom: 10px; border-bottom: 1px solid #0f0; padding-bottom: 5px;}
        
        .hud-row { display: flex; justify-content: space-between; margin-top: 10px; font-size: 0.9rem;}
        
        .bar-container { width: 100%; height: 10px; background: #222; margin-top: 5px; border: 1px solid #555; position: relative;}
        .bar-fill { height: 100%; background: #0f0; width: 0%; transition: width 0.1s, background 0.2s;}

        #status-text {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            font-size: 2rem; font-weight: bold; letter-spacing: 5px;
            text-shadow: 0 0 10px #0f0; transition: color 0.3s;
        }

        .crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 50px; height: 50px; border: 1px solid rgba(0, 255, 0, 0.3);
            border-radius: 50%; pointer-events: none;
        }
        .crosshair::before, .crosshair::after {
            content: ''; position: absolute; background: rgba(0, 255, 0, 0.3);
        }
        .crosshair::before { top: 50%; left: -20px; right: -20px; height: 1px; }
        .crosshair::after { left: 50%; top: -20px; bottom: -20px; width: 1px; }

        /* Setup UI */
        #ui-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0, 0, 0, 0.95); z-index: 100;
        }

        .cyber-btn {
            background: transparent; color: #0f0; border: 2px solid #0f0;
            padding: 15px 40px; font-size: 1.2rem; font-family: inherit;
            cursor: pointer; text-transform: uppercase; letter-spacing: 5px;
            transition: all 0.2s;
        }
        .cyber-btn:hover { background: #0f0; color: #000; box-shadow: 0 0 30px #0f0; }

        canvas { display: none; width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>
    <div class="crt-overlay"></div>

    <!-- The Sci-Fi HUD -->
    <div id="hud">
        <div id="status-text">INITIALIZING...</div>
        <div class="crosshair"></div>
        
        <div class="hud-panel" style="align-self: flex-start;">
            <div class="hud-title">SENSORS_DATA</div>
            
            <div class="hud-row"><span>KINETIC (MOTION)</span><span id="txt-motion">0%</span></div>
            <div class="bar-container"><div class="bar-fill" id="bar-motion"></div></div>
            
            <div class="hud-row"><span>ACOUSTIC (AUDIO)</span><span id="txt-audio">0%</span></div>
            <div class="bar-container"><div class="bar-fill" id="bar-audio"></div></div>
        </div>

        <div class="hud-panel" style="align-self: flex-end; text-align: right; border-color: #0ff; color: #0ff;">
            <div class="hud-title" style="border-bottom-color: #0ff;">MEDITATION_TRACKER</div>
            <div class="hud-row" style="justify-content: flex-end; color: #fff;">ZEN TIME: <span id="txt-zen" style="margin-left: 10px; font-weight: bold; color: #0ff;">0.0s</span></div>
            <div style="font-size: 0.7rem; margin-top: 5px; color: #777;">STAY PERFECTLY STILL</div>
        </div>
    </div>

    <!-- Setup Screen -->
    <div id="ui-overlay">
        <h1 style="font-size: 3rem; margin-bottom: 20px; text-shadow: 0 0 20px #0f0;">BIO-KINETIC ENGINE</h1>
        <p style="margin-bottom: 30px; color: #888; max-width: 500px; text-align: center;">
            Detects your movement and sound.<br><br>
            <span style="color:#0ff">🧘‍♂️ STILLNESS: Builds Zen Focus Time</span><br>
            <span style="color:#f50">🏃‍♂️ MOVEMENT: Activates Thermal Workout Mode</span>
        </p>
        <button class="cyber-btn" id="start-btn">ACTIVATE SENSORS</button>
    </div>

    <video id="video" autoplay playsinline muted style="display:none;"></video>
    <canvas id="processing-canvas" style="display:none;"></canvas>
    <canvas id="output-canvas"></canvas>

    <script>
        const startBtn = document.getElementById('start-btn');
        const uiOverlay = document.getElementById('ui-overlay');
        const hud = document.getElementById('hud');
        const video = document.getElementById('video');
        
        const procCanvas = document.getElementById('processing-canvas');
        const procCtx = procCanvas.getContext('2d', { willReadFrequently: true });
        
        const outCanvas = document.getElementById('output-canvas');
        const outCtx = outCanvas.getContext('2d');

        // UI Elements
        const barMotion = document.getElementById('bar-motion');
        const barAudio = document.getElementById('bar-audio');
        const txtMotion = document.getElementById('txt-motion');
        const txtAudio = document.getElementById('txt-audio');
        const txtZen = document.getElementById('txt-zen');
        const statusText = document.getElementById('status-text');
        const hudPanels = document.querySelectorAll('.hud-panel');

        // Config
        let cellWidth, cellHeight;
        let numCols = 160; 
        let numRows;

        // Character Sets
        const charSetZen = [' ', '.', '·', '°', '✧', '✦', '⚝', 'O', '0'];
        const charSetThermal = [' ', '░', '▒', '▓', '█', 'W', 'M', '@', '8'];
        const charSetNormal = [' ', '.', ',', ':', ';', 'i', '1', 't', 'f', 'L', 'C', 'G', '0', '8', '@', '█'];

        // Sensors & State
        let audioContext, analyser, dataArray;
        let previousFrameData = null;
        let motionLevel = 0;
        let audioLevel = 0;
        let zenTimer = 0;
        let lastTime = 0;
        
        const MOTION_THRESHOLD = 20; // Pixel difference threshold
        const ZEN_MAX_NOISE = 15;
        const ZEN_MAX_MOTION = 5;

        startBtn.addEventListener('click', async () => {
            startBtn.textContent = "CALIBRATING...";
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480 },
                    audio: true
                });

                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    resizeCanvases();
                    window.addEventListener('resize', resizeCanvases);

                    setupAudio(stream);
                    
                    uiOverlay.style.opacity = '0';
                    setTimeout(() => {
                        uiOverlay.style.display = 'none';
                        outCanvas.style.display = 'block';
                        hud.style.display = 'flex';
                        lastTime = performance.now();
                        requestAnimationFrame(renderLoop);
                    }, 500);
                };
            } catch (err) {
                console.error(err);
                startBtn.textContent = "SENSOR ACCESS DENIED";
                startBtn.style.color = "red";
                startBtn.style.borderColor = "red";
            }
        });

        function setupAudio(stream) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;
            source.connect(analyser);
            dataArray = new Uint8Array(analyser.frequencyBinCount);
        }

        function resizeCanvases() {
            outCanvas.width = window.innerWidth;
            outCanvas.height = window.innerHeight;
            
            cellWidth = outCanvas.width / numCols;
            cellHeight = cellWidth * 1.5; 
            numRows = Math.floor(outCanvas.height / cellHeight);

            procCanvas.width = numCols;
            procCanvas.height = numRows;

            outCtx.font = `bold ${Math.ceil(cellHeight)}px 'Courier New', monospace`;
            outCtx.textAlign = "center";
            outCtx.textBaseline = "middle";
            previousFrameData = null; // Reset motion tracking on resize
        }

        function renderLoop(currentTime) {
            requestAnimationFrame(renderLoop);
            if (video.readyState !== video.HAVE_ENOUGH_DATA) return;

            const deltaTime = (currentTime - lastTime) / 1000;
            lastTime = currentTime;

            // --- 1. AUDIO ANALYSIS ---
            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length / 2; i++) { sum += dataArray[i]; }
            // Smooth out audio level
            let currentAudio = sum / (dataArray.length / 2);
            audioLevel = audioLevel * 0.8 + currentAudio * 0.2; 
            let audioPercent = Math.min(100, Math.floor((audioLevel / 100) * 100));

            // --- 2. MOTION ANALYSIS (FRAME DIFFERENCING) ---
            procCtx.save();
            procCtx.translate(procCanvas.width, 0);
            procCtx.scale(-1, 1);
            procCtx.drawImage(video, 0, 0, procCanvas.width, procCanvas.height);
            procCtx.restore();

            const imgData = procCtx.getImageData(0, 0, procCanvas.width, procCanvas.height);
            const pixels = imgData.data;
            
            let changedPixels = 0;
            if (previousFrameData) {
                for (let i = 0; i < pixels.length; i += 4) {
                    const rDiff = Math.abs(pixels[i] - previousFrameData[i]);
                    const gDiff = Math.abs(pixels[i+1] - previousFrameData[i+1]);
                    const bDiff = Math.abs(pixels[i+2] - previousFrameData[i+2]);
                    
                    if ((rDiff + gDiff + bDiff) / 3 > MOTION_THRESHOLD) {
                        changedPixels++;
                    }
                }
            }
            
            // Save current frame for next time
            previousFrameData = new Uint8ClampedArray(pixels);

            // Calculate Motion Percentage
            const totalPixels = numCols * numRows;
            let currentMotionRaw = (changedPixels / totalPixels) * 100;
            // Amplify and smooth motion reading
            currentMotionRaw = Math.min(100, currentMotionRaw * 3); 
            motionLevel = motionLevel * 0.85 + currentMotionRaw * 0.15;
            let motionPercent = Math.floor(motionLevel);

            // --- 3. STATE MACHINE ---
            let state = "NORMAL";
            if (motionLevel < ZEN_MAX_MOTION && audioLevel < ZEN_MAX_NOISE) {
                state = "ZEN";
                zenTimer += deltaTime;
            } else {
                zenTimer = 0; // Reset zen timer
                if (motionLevel > 50 || audioLevel > 70) {
                    state = "OVERDRIVE";
                } else if (motionLevel > 15) {
                    state = "KINETIC";
                }
            }

            // --- 4. UPDATE HUD UI ---
            barMotion.style.width = `${motionPercent}%`;
            txtMotion.textContent = `${motionPercent}%`;
            barAudio.style.width = `${audioPercent}%`;
            txtAudio.textContent = `${audioPercent}%`;
            txtZen.textContent = zenTimer.toFixed(1) + "s";

            // UI Styling based on state
            if (state === "ZEN") {
                statusText.textContent = "STATE: ZEN (MEDITATION)";
                statusText.style.color = "#0ff";
                statusText.style.textShadow = "0 0 15px #0ff";
                barMotion.style.background = "#0ff";
                barAudio.style.background = "#0ff";
                document.body.style.color = "#0ff"; // Affects HUD borders
            } else if (state === "KINETIC") {
                statusText.textContent = "STATE: KINETIC (WORKOUT)";
                statusText.style.color = "#ff5500";
                statusText.style.textShadow = "0 0 15px #ff5500";
                barMotion.style.background = "#ff5500";
                barAudio.style.background = "#ff5500";
                document.body.style.color = "#0f0";
            } else if (state === "OVERDRIVE") {
                statusText.textContent = "!! OVERDRIVE !!";
                statusText.style.color = "#ff0000";
                statusText.style.textShadow = "0 0 20px #ff0000";
                barMotion.style.background = "#ff0000";
                barAudio.style.background = "#ff0000";
                document.body.style.color = "#f00";
                // Shake text
                statusText.style.transform = `translateX(calc(-50% + ${(Math.random()-0.5)*10}px))`;
            } else {
                statusText.textContent = "STATE: IDLE";
                statusText.style.color = "#0f0";
                statusText.style.textShadow = "0 0 10px #0f0";
                barMotion.style.background = "#0f0";
                barAudio.style.background = "#0f0";
                document.body.style.color = "#0f0";
                statusText.style.transform = "translateX(-50%)";
            }

            // --- 5. RENDER ASCII FRAME ---
            
            // Fading logic based on state
            if (state === "ZEN") {
                outCtx.fillStyle = 'rgba(0, 5, 15, 0.05)'; // Deep trails, very slow fade
                outCtx.fillRect(0, 0, outCanvas.width, outCanvas.height);
            } else if (state === "KINETIC") {
                outCtx.fillStyle = 'rgba(0, 0, 0, 0.4)'; // Shorter trails
                outCtx.fillRect(0, 0, outCanvas.width, outCanvas.height);
            } else {
                outCtx.fillStyle = 'rgba(0, 0, 0, 1)'; // Instant refresh
                outCtx.fillRect(0, 0, outCanvas.width, outCanvas.height);
            }

            for (let y = 0; y < numRows; y++) {
                for (let x = 0; x < numCols; x++) {
                    const idx = (y * numCols + x) * 4;
                    const r = pixels[idx];
                    const g = pixels[idx + 1];
                    const b = pixels[idx + 2];
                    
                    const brightness = (0.299 * r + 0.587 * g + 0.114 * b);
                    if (brightness < 15 && state !== "OVERDRIVE") continue;

                    const posX = x * cellWidth + (cellWidth / 2);
                    const posY = y * cellHeight + (cellHeight / 2);

                    if (state === "ZEN") {
                        // Cyan/Blue coloring, magical characters
                        const charIdx = Math.floor((brightness / 255) * (charSetZen.length - 1));
                        outCtx.fillStyle = brightness > 200 ? '#fff' : `rgb(0, ${Math.min(255, g+50)}, ${Math.min(255, b+100)})`;
                        
                        // Float effect
                        const floatY = Math.sin(currentTime/1000 + x) * 2;
                        outCtx.fillText(charSetZen[charIdx], posX, posY + floatY);

                    } else if (state === "KINETIC") {
                        // Thermal coloring based on brightness
                        const charIdx = Math.floor((brightness / 255) * (charSetThermal.length - 1));
                        
                        // Thermal Color Map (Dark->Red->Orange->Yellow->White)
                        let thR, thG, thB;
                        if (brightness < 85) { thR = brightness * 3; thG = 0; thB = 0; }
                        else if (brightness < 170) { thR = 255; thG = (brightness - 85) * 3; thB = 0; }
                        else { thR = 255; thG = 255; thB = (brightness - 170) * 3; }
                        
                        outCtx.fillStyle = `rgb(${thR}, ${thG}, ${thB})`;
                        outCtx.fillText(charSetThermal[charIdx], posX, posY);

                    } else if (state === "OVERDRIVE") {
                        // Glitch Chaos
                        if (Math.random() > 0.4) {
                            const charIdx = Math.floor(Math.random() * charSetThermal.length);
                            const char = charSetThermal[charIdx];
                            const glitchOffset = (Math.random() - 0.5) * 20;
                            
                            outCtx.fillStyle = '#f00';
                            outCtx.fillText(char, posX - 5 + glitchOffset, posY);
                            outCtx.fillStyle = '#0ff';
                            outCtx.fillText(char, posX + 5 + glitchOffset, posY);
                            if (Math.random() > 0.5) {
                                outCtx.fillStyle = '#fff';
                                outCtx.fillText(char, posX + glitchOffset, posY);
                            }
                        }
                    } else {
                        // Normal mode (True color)
                        const charIdx = Math.floor((brightness / 255) * (charSetNormal.length - 1));
                        outCtx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                        outCtx.fillText(charSetNormal[charIdx], posX, posY);
                    }
                }
            }
            
            // Overdrive Visual FX
            if (state === "OVERDRIVE" && Math.random() > 0.6) {
                outCtx.fillStyle = 'rgba(255, 0, 0, 0.1)';
                outCtx.fillRect(0, Math.random() * outCanvas.height, outCanvas.width, Math.random() * 100);
            }
        }
    </script>
</body>
</html>
